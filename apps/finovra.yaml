apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finovra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/leomonte-dev/gitops.git
    targetRevision: main
    path: helm-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: finovra
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true