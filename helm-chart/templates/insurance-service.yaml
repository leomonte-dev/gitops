apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-service
  labels:
    app: insurance-service
spec:
  replicas: {{ (index .Values "insurance-service").replicas }}
  selector:
    matchLabels:
      app: insurance-service
  template:
    metadata:
      labels:
        app: insurance-service
    spec:
      containers:
        - name: insurance-service
          image: "{{ .Values.image.repository }}/finovra-insurance-service:{{ (index .Values "insurance-service").image.tag | default .Values.image.tag }}"
          ports:
            - containerPort: {{ (index .Values "insurance-service").service.port }}
          env:
            - name: PORT
              value: "{{ (index .Values "insurance-service").service.port }}"
            - name: VERSION
              value: "{{ (index .Values "insurance-service").image.tag | default .Values.image.tag }}"
            - name: FAIL_MODE
              value: "{{ (index .Values "insurance-service").failMode }}"
            - name: LATENCY_MS
              value: "{{ (index .Values "insurance-service").latencyMs }}"
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ (index .Values "insurance-service").service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ (index .Values "insurance-service").service.port }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ (index .Values "insurance-service").service.port }}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-service
  labels:
    app: insurance-service
spec:
  selector:
    app: insurance-service
  ports:
    - port: {{ (index .Values "insurance-service").service.port }}
      targetPort: {{ (index .Values "insurance-service").service.port }}